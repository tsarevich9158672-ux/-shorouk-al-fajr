<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Shorouk Al Fajr — بسکیت و نەستلە</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<style>
:root{
  --navy:#16295C;--navy-deep:#0E1D45;--navy-light:#233B7A;
  --green:#00D563;--green-deep:#00B854;--green-soft:#E6FBF0;
  --white:#FFFFFF;--off-white:#F8FAFC;
  --gray-50:#F5F7FA;--gray-100:#EBEFF5;--gray-200:#DDE3ED;
  --gray-400:#8B95A8;--gray-600:#4A5468;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow-sm:0 1px 2px rgba(22,41,92,.04),0 2px 8px rgba(22,41,92,.05);
  --shadow:0 4px 24px rgba(22,41,92,.07),0 1px 3px rgba(22,41,92,.04);
  --shadow-lg:0 20px 50px rgba(22,41,92,.12),0 4px 12px rgba(22,41,92,.06);
  --shadow-green:0 20px 50px rgba(0,213,99,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Noto Kufi Arabic','Inter',sans-serif;background:var(--white);color:var(--navy);line-height:1.65;overflow-x:hidden;transition:background .3s,color .3s}
html[dir="ltr"] body{font-family:'Inter','Noto Kufi Arabic',sans-serif}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:1rem;color:inherit;-webkit-appearance:none;border-radius:0}
a{color:inherit;text-decoration:none}
::selection{background:var(--green);color:var(--white)}
.container{max-width:1280px;margin:0 auto;padding:0 24px}
.logo-svg{width:100%;height:100%;display:block}

.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--gray-100)}
.header.scrolled{background:rgba(255,255,255,.98);box-shadow:var(--shadow-sm)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:80px;gap:20px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800}
.logo-img{width:54px;height:54px;border-radius:14px;background:var(--white);display:grid;place-items:center;box-shadow:0 4px 14px rgba(22,41,92,.1);overflow:hidden;padding:5px;flex-shrink:0}
.logo-img img{width:100%;height:100%;object-fit:contain}
.logo-text{display:flex;flex-direction:column;line-height:1.05}
.logo-text b{font-size:1rem;font-weight:800;color:var(--navy)}
.logo-text small{font-size:.68rem;color:var(--gray-400);font-weight:500;text-transform:uppercase;margin-top:2px}
.nav{display:flex;gap:4px;align-items:center}
.nav a{padding:10px 18px;border-radius:12px;font-weight:500;font-size:.94rem;color:var(--gray-600);transition:all .25s var(--ease)}
.nav a:hover{color:var(--navy);background:var(--gray-50)}
.header-actions{display:flex;align-items:center;gap:10px}
.lang-switch{display:flex;background:var(--gray-50);border-radius:12px;padding:3px;gap:2px}
.lang-btn{padding:8px 14px;border-radius:9px;font-weight:600;font-size:.82rem;color:var(--gray-600);transition:all .25s var(--ease)}
.lang-btn.active{background:var(--white);color:var(--navy);box-shadow:var(--shadow-sm)}
.theme-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--gray-50);border-radius:14px;transition:all .3s var(--ease);font-size:20px;cursor:pointer;border:1px solid var(--gray-200);line-height:1}
.theme-btn:hover{transform:translateY(-2px) rotate(15deg);background:var(--green-soft)}
.cart-btn{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--navy);color:var(--white);border-radius:14px;transition:all .3s var(--ease)}
.cart-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-green)}
.cart-btn svg{width:20px;height:20px}
.cart-count{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--green);color:var(--white);font-size:.7rem;font-weight:800;min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:grid;place-items:center;border:2px solid var(--white);transition:transform .3s var(--ease)}
.cart-count.bump{animation:bump .4s var(--ease)}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.menu-btn{display:none;width:48px;height:48px;border-radius:14px;background:var(--gray-50);align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px;color:var(--navy)}

.rep-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-light) 100%);color:var(--white);padding:10px 0;font-size:.85rem;display:none}
.rep-bar.show{display:block}
.rep-bar-inner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.rep-bar-icon{background:var(--green);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.rep-bar b{color:var(--green);font-weight:800}
.rep-bar select{background:rgba(255,255,255,.1);color:var(--white);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer}
.rep-bar select option{background:var(--navy);color:var(--white)}

.hero{position:relative;padding:100px 0 130px;overflow:hidden;background:var(--off-white)}
.hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 15% 25%,rgba(0,213,99,.1) 0%,transparent 45%),radial-gradient(circle at 85% 75%,rgba(22,41,92,.08) 0%,transparent 45%);pointer-events:none}
.hero-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(22,41,92,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(22,41,92,.03) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(ellipse at center,black 25%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 70%);pointer-events:none}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:80px;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--gray-200);padding:8px 18px;border-radius:100px;font-size:.82rem;font-weight:600;color:var(--gray-600);margin-bottom:32px;box-shadow:var(--shadow-sm)}
.hero-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
.hero-badge .dot::after{content:'';position:absolute;inset:-5px;border-radius:50%;background:var(--green);opacity:.35;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.5);opacity:0}}
.hero h1{font-size:clamp(2.4rem,5.5vw,4.2rem);font-weight:800;line-height:1.15;letter-spacing:-.03em;margin-bottom:26px;color:var(--navy)}
.hero h1 .accent{position:relative;display:inline-block;color:var(--navy)}
.hero h1 .accent::after{content:'';position:absolute;left:0;right:0;bottom:.08em;height:.28em;background:linear-gradient(90deg,var(--green) 0%,var(--green-deep) 100%);border-radius:4px;z-index:-1;opacity:.85;transform:scaleX(0);transform-origin:left;animation:slideIn .9s var(--ease) .3s forwards}
@keyframes slideIn{to{transform:scaleX(1)}}
.hero p{font-size:1.1rem;color:var(--gray-600);max-width:520px;margin-bottom:44px;line-height:1.8}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 34px;border-radius:16px;font-weight:600;font-size:1rem;transition:all .3s var(--ease)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--navy);color:var(--white);box-shadow:0 4px 14px rgba(22,41,92,.18)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:var(--shadow-green)}
.btn-outline{background:var(--white);color:var(--navy);border:2px solid var(--navy)}
.btn-outline:hover{background:var(--navy);color:var(--white);transform:translateY(-3px)}
.hero-visual{position:relative;display:grid;place-items:center}
.hero-blob{position:relative;width:min(480px,100%);aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--green) 0%,var(--green-deep) 45%,var(--navy) 100%);display:grid;place-items:center;box-shadow:0 50px 90px rgba(0,213,99,.35),0 20px 50px rgba(22,41,92,.25);animation:float 6s ease-in-out infinite;padding:60px}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(2deg)}}
.hero-blob-inner{width:100%;height:100%;display:grid;place-items:center}
.hero-blob-inner .logo-svg,.hero-blob-inner img{background:var(--white);border-radius:20px;padding:16px;width:100%;height:100%;object-fit:contain}

.section{padding:110px 0}
.section-head{text-align:center;margin-bottom:70px;max-width:640px;margin-inline:auto}
.section-tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--green-deep);padding:7px 16px;border-radius:100px;background:var(--green-soft);margin-bottom:20px}
.section-head h2{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2;margin-bottom:16px;color:var(--navy)}
.section-head p{color:var(--gray-600);font-size:1.05rem;line-height:1.7}

.controls{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:44px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:240px;max-width:400px}
.search-wrap svg{position:absolute;inset-inline-start:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gray-400);pointer-events:none}
.search-box{width:100%;padding:14px 20px 14px 48px;border:1.5px solid var(--gray-200);border-radius:14px;background:var(--white);outline:none;transition:all .3s var(--ease);font-size:.95rem;color:var(--navy)}
html[dir="rtl"] .search-box{padding:14px 48px 14px 20px}
.search-box:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,213,99,.15)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:11px 22px;border-radius:12px;font-weight:600;font-size:.88rem;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-600);transition:all .25s var(--ease)}
.filter-btn.active{background:var(--navy);color:var(--white);border-color:var(--navy)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.card{background:var(--white);border-radius:26px;overflow:hidden;transition:all .4s var(--ease);position:relative;border:1px solid var(--gray-100);display:flex;flex-direction:column}
.card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);border-color:transparent}
.card-img{aspect-ratio:4/3;background:var(--off-white);display:grid;place-items:center;font-size:4rem;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .card-img img{transform:scale(1.08)}
.card-badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--navy);color:var(--white);padding:5px 11px;border-radius:100px;font-size:.65rem;font-weight:700;text-transform:uppercase;z-index:1}
.card-badge.green{background:var(--green)}

.card-top-badges{position:absolute;top:12px;inset-inline-end:12px;display:flex;flex-direction:column;gap:6px;z-index:2;align-items:flex-end}
.badge-new{background:linear-gradient(135deg,#FF6B6B,#E53935);color:#fff;padding:5px 11px;border-radius:100px;font-size:.65rem;font-weight:800;box-shadow:0 4px 12px rgba(229,57,53,.35)}
.badge-best{background:linear-gradient(135deg,#FFB800,#FF8C00);color:#fff;padding:5px 11px;border-radius:100px;font-size:.65rem;font-weight:800;box-shadow:0 4px 12px rgba(255,140,0,.35)}
.badge-sale{background:linear-gradient(135deg,#E91E63,#C2185B);color:#fff;padding:5px 11px;border-radius:100px;font-size:.65rem;font-weight:800;box-shadow:0 4px 12px rgba(233,30,99,.35)}
.badge-out{background:#4A5468;color:#fff;padding:5px 11px;border-radius:100px;font-size:.65rem;font-weight:800}

.card-body{padding:18px;display:flex;flex-direction:column;flex:1;gap:8px}
.card-title{font-weight:700;font-size:.98rem;line-height:1.35;color:var(--navy)}
.card-desc{font-size:.8rem;color:var(--gray-600);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}

.stock-line{font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:5px;padding:4px 0}
.stock-line.ok{color:var(--green-deep)}
.stock-line.low{color:#E65100}
.stock-line.out{color:#E53935}

.unit-options{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--gray-100)}
.unit-row{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:11px;background:var(--off-white);transition:all .25s var(--ease)}
.unit-row:hover{background:var(--green-soft)}
.unit-row-label{display:flex;flex-direction:column;gap:1px;flex:0 1 auto;min-width:0;overflow:hidden}
.unit-row-title{font-weight:700;font-size:.78rem;color:var(--navy);display:flex;align-items:center;gap:4px}
.unit-row-title .ico{font-size:.85rem;flex-shrink:0}
.unit-row-sub{font-size:.6rem;color:var(--gray-400);font-weight:500}
.unit-row-price{font-weight:800;font-size:.82rem;color:var(--navy);white-space:nowrap;flex:1 1 auto;text-align:end;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.unit-row-price small{font-size:.58rem;color:var(--gray-400);font-weight:600;margin-inline-start:2px}
.price-old{font-size:.65rem;color:var(--gray-400);text-decoration:line-through;font-weight:500}
.price-new{color:#E91E63;font-weight:800}
.price-new small{color:#E91E63}

.unit-add-btn{width:32px;height:32px;border-radius:10px;background:var(--navy);color:var(--white);display:grid;place-items:center;transition:all .25s var(--ease);flex-shrink:0}
.unit-add-btn:hover{background:var(--green);transform:scale(1.08)}
.unit-add-btn:disabled{background:var(--gray-200);cursor:not-allowed;opacity:.6}
.unit-add-btn:disabled:hover{transform:none;background:var(--gray-200)}
.unit-add-btn svg{width:14px;height:14px}

.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--gray-400);border:2px dashed var(--gray-200);border-radius:26px}

.about{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:var(--white);border-radius:44px;margin:0 24px;padding:110px 0;position:relative;overflow:hidden}
.about::before{content:'';position:absolute;top:-40%;inset-inline-end:-15%;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(0,213,99,.18),transparent 65%)}
.about-inner{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;position:relative;z-index:2}
.about .section-tag{background:rgba(0,213,99,.15);color:var(--green)}
.about h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;line-height:1.2;margin-bottom:26px}
.about h2 .accent{color:var(--green)}
.about p{color:rgba(255,255,255,.72);margin-bottom:18px;line-height:1.9;font-size:1rem}
.about-features{display:grid;gap:22px;margin-top:38px}
.feature{display:flex;gap:18px;align-items:flex-start}
.feature-ico{width:50px;height:50px;flex-shrink:0;border-radius:14px;background:rgba(0,213,99,.14);border:1px solid rgba(0,213,99,.3);display:grid;place-items:center;font-size:1.4rem}
.feature-txt b{display:block;font-size:.98rem;margin-bottom:4px;font-weight:700;color:var(--white)}
.feature-txt small{color:rgba(255,255,255,.55);font-size:.85rem}
.about-visual{display:grid;place-items:center}
.about-logo-card{width:min(360px,90%);aspect-ratio:1;background:var(--white);border-radius:30px;padding:40px;display:grid;place-items:center;box-shadow:0 30px 70px rgba(0,0,0,.3)}

.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.contact-card{background:var(--white);border:1px solid var(--gray-100);border-radius:26px;padding:34px 28px;transition:all .35s var(--ease);position:relative;overflow:hidden}
.contact-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.contact-card .ico{width:58px;height:58px;border-radius:16px;background:var(--green-soft);display:grid;place-items:center;font-size:1.6rem;margin-bottom:22px}
.contact-card h3{font-size:.78rem;font-weight:700;text-transform:uppercase;color:var(--gray-400);margin-bottom:10px}
.contact-card p,.contact-card a{color:var(--navy);font-size:1rem;font-weight:600;word-break:break-word}

.footer{background:var(--navy);color:rgba(255,255,255,.6);padding:80px 0 30px;margin-top:90px}
.footer-top{display:grid;grid-template-columns:2fr 1fr 1fr;gap:60px;margin-bottom:50px}
.footer .logo-img{background:var(--white)}
.footer .logo-text b{color:var(--white)}
.footer-brand p{margin-top:22px;font-size:.9rem;line-height:1.85;max-width:340px}
.footer-col h4{color:var(--white);font-size:.8rem;font-weight:700;text-transform:uppercase;margin-bottom:22px}
.footer-col a{display:block;color:rgba(255,255,255,.6);font-size:.9rem;padding:7px 0}
.footer-col a:hover{color:var(--green)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding-top:26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;font-size:.85rem;color:rgba(255,255,255,.4)}
.admin-link{color:rgba(255,255,255,.4);cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px}
.admin-link:hover{color:var(--green);background:rgba(0,213,99,.1)}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(14,29,69,.55);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.35s var(--ease)}
.overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;inset-inline-end:0;height:100dvh;width:min(460px,100vw);background:var(--white);z-index:210;transform:translateX(100%);transition:transform .4s var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(14,29,69,.2)}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.open{transform:translateX(0)!important}
.drawer-head{padding:26px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{font-weight:800;font-size:1.15rem;color:var(--navy)}
.close-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--gray-50);color:var(--navy)}
.close-btn:hover{background:var(--navy);color:var(--white)}
.close-btn svg{width:18px;height:18px}
.drawer-body{flex:1;overflow-y:auto;padding:22px}
.cart-item{display:flex;gap:14px;padding:16px;border-radius:16px;background:var(--off-white);margin-bottom:12px}
.cart-item-img{width:72px;height:72px;border-radius:14px;background:var(--white);display:grid;place-items:center;font-size:2rem;flex-shrink:0;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-info h4{font-size:.92rem;font-weight:700;margin-bottom:6px;color:var(--navy);line-height:1.3}
.unit-tag{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--navy);color:var(--white);margin-bottom:6px}
.unit-tag.carton{background:var(--green)}
.cart-item-info .p{font-size:.85rem;color:var(--gray-600);font-weight:600;margin-bottom:8px}
.qty-ctrl{display:flex;align-items:center;gap:10px}
.qty-ctrl button{width:28px;height:28px;border-radius:9px;background:var(--white);color:var(--navy);font-weight:800;display:grid;place-items:center;border:1px solid var(--gray-200)}
.qty-ctrl button:hover{background:var(--navy);color:var(--white)}
.qty-ctrl span{font-weight:700;min-width:24px;text-align:center;font-size:.92rem}
.remove-btn{color:var(--gray-400);font-size:.75rem;font-weight:600;margin-top:8px}
.remove-btn:hover{color:#E53935}
.cart-empty{text-align:center;padding:80px 20px;color:var(--gray-400)}
.cart-empty .e{font-size:4rem;margin-bottom:16px;opacity:.5}
.drawer-foot{padding:26px;border-top:1px solid var(--gray-100);background:var(--off-white)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.total-row span:first-child{color:var(--gray-600);font-size:.9rem;font-weight:600}
.total-row .val{font-weight:800;font-size:1.4rem;color:var(--navy)}
.checkout-btn{width:100%;background:var(--navy);color:var(--white);padding:17px;border-radius:16px;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:10px}
.checkout-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-green)}

.modal-form{position:fixed;inset:0;z-index:400;background:rgba(14,29,69,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-form.open{display:flex}
.form-card{background:var(--white);border-radius:26px;width:min(720px,100%);max-height:92dvh;overflow-y:auto;box-shadow:0 30px 80px rgba(14,29,69,.3)}
.form-card-head{padding:26px 30px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:2;border-radius:26px 26px 0 0}
.form-card-head h3{font-weight:800;font-size:1.15rem;color:var(--navy)}
.form-card-body{padding:30px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.82rem;font-weight:700;margin-bottom:8px;color:var(--navy)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:13px 16px;border:1.5px solid var(--gray-200);border-radius:12px;background:var(--white);outline:none;transition:all .25s var(--ease);font-size:.95rem}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,213,99,.15)}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:12px;justify-content:flex-end;padding-top:24px;border-top:1px solid var(--gray-100);margin-top:12px}
.btn-cancel,.btn-save{padding:13px 28px;border-radius:12px;font-weight:700;font-size:.92rem}
.btn-cancel{background:var(--gray-50);color:var(--navy)}
.btn-save{background:var(--navy);color:var(--white)}
.btn-save:hover{transform:translateY(-2px);box-shadow:var(--shadow-green)}

.admin-modal{position:fixed;inset:0;z-index:300;background:var(--white);display:none;flex-direction:column;overflow:hidden}
.admin-modal.open{display:flex}
.admin-head{background:var(--navy);color:var(--white);padding:22px 30px;display:flex;align-items:center;justify-content:space-between}
.admin-head h2{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:10px;color:var(--white)}
.admin-head h2 svg{width:20px;height:20px;color:var(--green)}
.admin-head .close-btn{background:rgba(255,255,255,.1);color:var(--white)}
.admin-tabs{display:flex;gap:4px;padding:14px 30px;border-bottom:1px solid var(--gray-100);background:var(--white);overflow-x:auto}
.admin-tab{padding:10px 22px;border-radius:10px;font-weight:600;font-size:.88rem;color:var(--gray-600);white-space:nowrap;position:relative}
.admin-tab.active{background:var(--navy);color:var(--white)}
.admin-tab .badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--green);color:var(--white);font-size:.6rem;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center}
.admin-body{flex:1;overflow-y:auto;padding:34px;background:var(--off-white)}
.admin-pane{display:none;max-width:1100px;margin:0 auto}
.admin-pane.active{display:block}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.admin-toolbar b{font-size:1rem;color:var(--navy)}
.btn-add{background:var(--navy);color:var(--white);padding:12px 24px;border-radius:12px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:8px}
.btn-add:hover{transform:translateY(-2px);box-shadow:var(--shadow-green)}
.admin-list{display:grid;gap:12px}
.admin-row{background:var(--white);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;border:1px solid var(--gray-100)}
.admin-row-img{width:66px;height:66px;border-radius:14px;background:var(--off-white);display:grid;place-items:center;font-size:1.8rem;flex-shrink:0;overflow:hidden}
.admin-row-img img{width:100%;height:100%;object-fit:cover}
.admin-row-info{flex:1;min-width:0}
.admin-row-info h4{font-size:.95rem;font-weight:700;margin-bottom:6px;color:var(--navy)}
.admin-row-info .meta{font-size:.78rem;color:var(--gray-600);display:flex;gap:8px;flex-wrap:wrap}
.admin-row-info .meta span{background:var(--gray-50);padding:3px 9px;border-radius:8px;font-weight:600}
.admin-row-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--gray-50);display:grid;place-items:center;color:var(--navy)}
.icon-btn:hover{background:var(--green);color:var(--white)}
.icon-btn.danger:hover{background:#FFEBEE;color:#E53935}
.icon-btn svg{width:16px;height:16px}
.img-preview{width:100%;aspect-ratio:16/9;border:2px dashed var(--gray-200);border-radius:16px;display:grid;place-items:center;margin-bottom:16px;background:var(--off-white);overflow:hidden;font-size:3rem;color:var(--gray-400)}
.img-preview img{width:100%;height:100%;object-fit:cover}
.lang-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--gray-50);padding:4px;border-radius:12px}
.lang-tab{flex:1;padding:10px 16px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--gray-600)}
.lang-tab.active{background:var(--white);color:var(--navy);box-shadow:var(--shadow-sm)}
.lang-pane{display:none}
.lang-pane.active{display:block}
.login-screen{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 60%,#0A1535 100%)}
.login-card{background:var(--white);padding:50px 42px;border-radius:26px;width:min(420px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-card .logo-img{margin:0 auto 26px;width:80px;height:80px;padding:10px}
.login-card h2{font-size:1.3rem;margin-bottom:8px;font-weight:800;color:var(--navy)}
.login-card p{color:var(--gray-600);font-size:.9rem;margin-bottom:28px}
.login-card input{width:100%;padding:14px 18px;border:1.5px solid var(--gray-200);border-radius:12px;margin-bottom:16px;outline:none;text-align:center;font-size:1rem}
.login-card input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,213,99,.15)}
.login-card button.primary{width:100%;background:var(--navy);color:var(--white);padding:15px;border-radius:12px;font-weight:700}
.err-msg{color:#E53935;font-size:.85rem;margin-top:12px;min-height:20px}
.settings-grid{display:grid;gap:20px;max-width:680px}
.storage-info{background:var(--green-soft);border:1px solid rgba(0,213,99,.3);border-radius:14px;padding:16px 20px;font-size:.85rem;color:var(--green-deep);font-weight:500}

.logo-upload-box{display:flex;gap:14px;align-items:center;padding:14px;background:var(--off-white);border-radius:14px;border:1px solid var(--gray-100)}
.logo-preview-box{width:80px;height:80px;border-radius:14px;background:var(--white);border:1px solid var(--gray-200);display:grid;place-items:center;overflow:hidden;padding:8px;flex-shrink:0}
.logo-preview-box img{width:100%;height:100%;object-fit:contain}
.logo-preview-box .placeholder{font-weight:900;color:var(--gray-400);font-size:.85rem}
.logo-upload-actions{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.logo-upload-actions input[type=file]{width:100%;font-size:.82rem;padding:10px;border:1.5px dashed var(--gray-200);border-radius:10px;background:var(--white);cursor:pointer}
.reset-logo-btn{padding:9px 16px;border-radius:10px;background:var(--white);color:var(--navy);font-weight:700;font-size:.78rem;border:1.5px solid var(--gray-200);cursor:pointer;width:fit-content}
.logo-hint{font-size:.75rem;color:var(--gray-400);line-height:1.5}

.unit-input-group{background:var(--green-soft);border:1.5px solid rgba(0,213,99,.3);border-radius:16px;padding:18px;margin-bottom:20px}
.unit-input-group .gtitle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.88rem;color:var(--green-deep);margin-bottom:14px}
.unit-input-group.discount-group{background:#FFF3E0;border-color:#FFB74D}
.unit-input-group.discount-group .gtitle{color:#E65100}

.bulk-panel{background:var(--white);border:1px solid var(--gray-100);border-radius:16px;padding:20px;margin-bottom:26px}
.bulk-panel-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bulk-panel-head .ico{width:36px;height:36px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;font-size:1.1rem}
.bulk-panel-head b{font-weight:800;font-size:.95rem;color:var(--navy)}
.bulk-panel-head small{font-size:.75rem;color:var(--gray-400);font-weight:500;margin-top:2px;display:block}
.bulk-inputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk-inputs input{width:90px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:.9rem;text-align:center;font-weight:700}
.bulk-btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.bulk-btn.inc{background:var(--green);color:var(--white)}
.bulk-btn.dec{background:#FFF3E0;color:#E65100}
.bulk-btn.set{background:var(--navy);color:var(--white)}

.rep-card{background:var(--white);border-radius:16px;padding:18px;border:1px solid var(--gray-100)}
.rep-card-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rep-avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--green) 0%,var(--green-deep) 100%);display:grid;place-items:center;color:var(--white);font-weight:800;font-size:1.2rem;flex-shrink:0}
.rep-card-info{flex:1;min-width:0}
.rep-card-info h4{font-size:1rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.rep-card-info .phone{font-size:.82rem;color:var(--gray-600);font-weight:600}
.rep-link-box{background:var(--green-soft);border:1px solid rgba(0,213,99,.3);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--green-deep);word-break:break-all;font-family:monospace;font-weight:600}
.rep-link-box button{margin-inline-start:auto;background:var(--green);color:var(--white);padding:6px 12px;border-radius:8px;font-weight:700;font-size:.72rem;cursor:pointer;flex-shrink:0}

.daily-report{background:linear-gradient(135deg,#16295C 0%,#233B7A 100%);color:#fff;border-radius:20px;padding:24px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(22,41,92,.25)}
.daily-report::before{content:'';position:absolute;top:-50%;inset-inline-end:-20%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,213,99,.18),transparent 65%);pointer-events:none}
.daily-report-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;position:relative;z-index:2}
.daily-report-head .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.daily-report-head .title .ico{font-size:1.4rem}
.daily-report-head .date{font-size:.78rem;color:rgba(255,255,255,.85);font-weight:600;background:rgba(255,255,255,.1);padding:6px 14px;border-radius:100px;border:1px solid rgba(255,255,255,.15)}
.daily-report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;position:relative;z-index:2}
.daily-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;text-align:center;transition:all .25s;backdrop-filter:blur(6px)}
.daily-stat:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.daily-stat .val{font-size:1.6rem;font-weight:800;line-height:1.1;margin-bottom:6px;color:#fff}
.daily-stat .val.green{color:#00D563}
.daily-stat .val.gold{color:#FFD54F}
.daily-stat .val.red{color:#FF6B6B}
.daily-stat .lbl{font-size:.72rem;color:rgba(255,255,255,.7);font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.daily-stat .lbl .ico{font-size:.85rem}

.daily-top{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;margin-top:12px;position:relative;z-index:2}
.daily-top-title{font-size:.78rem;font-weight:700;color:rgba(255,255,255,.7);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.daily-top-list{display:grid;gap:6px}
.daily-top-item{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.daily-top-item:last-child{border-bottom:none}
.daily-top-item .name{font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daily-top-item .qty{background:rgba(0,213,99,.2);color:#00D563;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:800;flex-shrink:0}
.daily-empty{color:rgba(255,255,255,.6);font-size:.85rem;text-align:center;padding:10px}

.order-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.order-stat{background:var(--white);border:1px solid var(--gray-100);border-radius:16px;padding:18px;text-align:center;transition:all .25s var(--ease)}
.order-stat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.order-stat .val{font-size:1.8rem;font-weight:800;color:var(--navy);line-height:1.2;margin-bottom:4px}
.order-stat .lbl{font-size:.75rem;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.order-stat.green .val{color:var(--green-deep)}

.orders-search{position:relative;margin-bottom:16px}
.orders-search svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gray-400);pointer-events:none}
.orders-search input{width:100%;padding:14px 48px;border:1.5px solid var(--gray-200);border-radius:14px;background:var(--white);outline:none;transition:all .3s var(--ease);font-size:.95rem;font-family:inherit}
html[dir="rtl"] .orders-search input{padding:14px 48px 14px 48px}
.orders-search input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,213,99,.15)}
.orders-search .clear-btn{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--gray-100);display:none;place-items:center;font-size:14px;color:var(--gray-600);cursor:pointer}
.orders-search .clear-btn.show{display:grid}

.order-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.order-filter{padding:8px 16px;border-radius:10px;font-weight:600;font-size:.82rem;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-600);transition:all .2s;cursor:pointer}
.order-filter.active{background:var(--navy);color:var(--white);border-color:var(--navy)}

.order-card{background:var(--white);border-radius:16px;padding:18px;border:1px solid var(--gray-100);margin-bottom:14px;transition:all .25s var(--ease)}
.order-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.order-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.order-num{font-family:monospace;font-weight:800;font-size:.9rem;color:var(--navy);background:var(--gray-50);padding:5px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.order-status{padding:5px 12px;border-radius:100px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.order-status.pending{background:#FFF3E0;color:#E65100}
.order-status.confirmed{background:#E3F2FD;color:#1565C0}
.order-status.shipped{background:#E8EAF6;color:#3F51B5}
.order-status.delivered{background:var(--green-soft);color:var(--green-deep)}
.order-status.cancelled{background:#FFEBEE;color:#E53935}
.order-date{font-size:.75rem;color:var(--gray-400);font-weight:600}
.order-customer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-size:.85rem}
.order-customer div{display:flex;align-items:center;gap:6px;color:var(--gray-600)}
.order-customer b{color:var(--navy);font-weight:700}
.order-customer .ico{font-size:.9rem;flex-shrink:0}
.order-items{background:var(--off-white);border-radius:12px;padding:12px;margin-bottom:14px}
.order-item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:.82rem;color:var(--navy);border-bottom:1px dashed var(--gray-200)}
.order-item-row:last-child{border-bottom:none}
.order-item-row .name{font-weight:700}
.order-item-row .qty{font-size:.75rem;color:var(--gray-600);margin-inline-start:6px}
.order-total{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;border-top:2px solid var(--gray-100);margin-top:8px;font-weight:800;font-size:1rem;color:var(--navy)}
.order-total .amount{color:var(--green-deep);font-size:1.2rem}
.order-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.order-btn{padding:8px 14px;border-radius:10px;font-weight:700;font-size:.75rem;transition:all .2s;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.order-btn.whatsapp{background:#25D366;color:var(--white)}
.order-btn.confirm{background:#E3F2FD;color:#1565C0}
.order-btn.deliver{background:var(--green-soft);color:var(--green-deep)}
.order-btn.cancel{background:#FFEBEE;color:#E53935}
.order-btn.delete{background:var(--gray-50);color:var(--gray-600)}
.order-btn:hover{transform:translateY(-2px);opacity:.9}
.order-note{background:#FFF8E1;border:1px solid #FFE082;border-radius:10px;padding:10px 12px;font-size:.82rem;color:#795548;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.order-empty{text-align:center;padding:60px 20px;color:var(--gray-400);border:2px dashed var(--gray-200);border-radius:16px}
.order-empty .e{font-size:3.5rem;margin-bottom:12px;opacity:.5}

.toast{position:fixed;bottom:32px;inset-inline-start:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:var(--white);padding:16px 28px;border-radius:16px;font-weight:600;z-index:500;font-size:.9rem;box-shadow:0 20px 50px rgba(14,29,69,.35);transition:all .4s var(--ease);opacity:0;display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast svg{width:18px;height:18px;flex-shrink:0;color:var(--green)}

/* DARK MODE */
html.dark{
  --white:#0F1115;--off-white:#151820;--gray-50:#1A1D26;--gray-100:#22252F;--gray-200:#2E323F;
  --gray-400:#6B7280;--gray-600:#A0A6B3;--navy:#E6E8EC;--navy-deep:#F5F6F8;--navy-light:#D0D4DB;

}

html.dark .header{background:rgba(15,17,21,.92);border-bottom-color:#22252F}

html.dark .menu-btn svg{color:#E6E8EC}
html.dark .theme-btn{background:#1A1D26;border-color:#22252F}
html.dark .theme-btn:hover{background:rgba(0,213,99,.15)}
html.dark .hero{background:#151820}
html.dark .hero h1{color:#E6E8EC}
html.dark .hero h1 .accent{color:#E6E8EC}
html.dark .hero p{color:#A0A6B3}
html.dark .hero-badge{background:#1A1D26;border-color:#22252F;color:#A0A6B3}
html.dark .btn-outline{background:#1A1D26;color:#E6E8EC;border-color:#E6E8EC}

html.dark .hero-blob-inner .logo-svg,html.dark .hero-blob-inner img{background:#0F1115}
html.dark .section-head h2{color:#E6E8EC}
html.dark .section-head p{color:#A0A6B3}
html.dark .search-box{background:#1A1D26;border-color:#22252F;color:#E6E8EC}
html.dark .filter-btn{background:#1A1D26;border-color:#22252F;color:#A0A6B3}
html.dark .filter-btn.active{background:#E6E8EC;color:#0F1115;border-color:#E6E8EC}
html.dark .card{background:#1A1D26;border-color:#22252F}

}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function t(key){const l=state.texts[state.lang]||{};const d=DEFAULT_TEXTS[state.lang]||{};return l[key]??d[key]??key;}
function toast(msg){const el=$('#toast');el.innerHTML=`<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg><span>${esc(msg)}</span>`;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(p='id'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20);}
function isNewProduct(p){if(!p.createdAt) return false;const days = (Date.now() - new Date(p.createdAt).getTime()) / (1000*60*60*24);return days <= 7;}
function getFinalDanaPrice(p){const orig = getDanaPrice(p);if(p.discount && p.discount > 0) return Math.round(orig * (1 - p.discount/100));return orig;}
function getFinalCartonPrice(p){const orig = getCartonPrice(p);if(p.discount && p.discount > 0) return Math.round(orig * (1 - p.discount/100));return orig;}
function getDanaPrice(p){ return +(p.priceDana || p.price || 0); }
function getCartonPrice(p){const dana = getDanaPrice(p);const pieces = +p.piecesPerCarton || 12;return +p.priceCarton || (dana * pieces);}
function getPieces(p){ return +p.piecesPerCarton || 12; }
function getPriceFor(p, unitType){if(unitType === 'carton') return getFinalCartonPrice(p);return getFinalDanaPrice(p);}
function getUnitLabel(unitType){return unitType === 'carton' ? t('carton') : t('dana');}

async function compressImage(file, maxW=900, quality=0.85){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>resolve('');
      img.src=e.target.result;
    };
    reader.onerror=()=>resolve('');
    reader.readAsDataURL(file);
  });
}

function injectLogo(){
  if(customLogo){
    document.querySelectorAll('[data-logo]').forEach(el=>{
      el.innerHTML='';
      const img=document.createElement('img');
      img.src=customLogo;img.alt='Shorouk Al Fajr';
      img.style.cssText='width:100%;height:100%;object-fit:contain;display:block';
      el.appendChild(img);
    });
    return;
  }
  const template = document.getElementById('safLogo');
  if(!template) return;
  document.querySelectorAll('[data-logo]').forEach(el=>{
    el.innerHTML='';
    const clone=template.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('width','100%');clone.setAttribute('height','100%');
    clone.removeAttribute('style');
    clone.classList.add('logo-svg');
    clone.setAttribute('preserveAspectRatio','xMidYMid meet');
    el.appendChild(clone);
  });
}

function getCurrentRep(){ return state.reps.find(r=>r.id===state.currentRepId) || null; }

function renderRepBar(){
  const bar = $('#repBar');
  const currentRep = getCurrentRep();
  const activeReps = state.reps.filter(r=>r.active !== false);
  if(activeReps.length === 0){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const select = $('#repSelect');
  const nameEl = $('#repBarName');
  if(currentRep){
    nameEl.textContent = currentRep.name;
    nameEl.style.display = 'inline';
    if(activeReps.length > 1){
      select.style.display = 'inline-block';
      select.innerHTML = activeReps.map(r=>`<option value="${r.id}" ${r.id===currentRep.id?'selected':''}>${esc(r.name)}</option>`).join('');
    } else { select.style.display = 'none'; }
  } else {
    nameEl.textContent = t('select_rep');
    select.style.display = 'inline-block';
    select.innerHTML = `<option value="">${esc(t('select_rep'))}</option>` + 
      activeReps.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
  }
}

function checkUrlRep(){
  const params = new URLSearchParams(location.search);

    if(rep && rep.active !== false){
      state.currentRepId = rep.id;
      localStorage.setItem('saf_current_rep', rep.id);
    }
  }
}

    return true;
  });
  if(!list.length){grid.innerHTML=`<div class="empty-state"><p>${esc(t('search_none'))}</p></div>`;return;}
  
  const cur = state.settings.currency||'IQD';

    const img=p.image?`<img src="${esc(p.image)}" alt="${esc(p.name?.[state.lang]||'')}" loading="lazy">`:(p.category==='biscuit'?'🍪':p.category==='nestle'?'🍫':'📦');

    if(outOfStock) topBadges.push(`<span class="badge-out">بەردەست نییە</span>`);
    
    let stockLine = '';
    if(stock !== null){
      if(outOfStock){
        stockLine = `<div class="stock-line out">❌ بەردەست نییە</div>`;
      } else if(stock <= 20){
        stockLine = `<div class="stock-line low">⚠️ کەم ماوە — ${stock}</div>`;
      } else {
        stockLine = `<div class="stock-line ok">✅ بەردەستە — ${stock}</div>`;

              <div class="unit-row-title"><span class="ico">🍪</span>${esc(t('dana'))}</div>
              <div class="unit-row-sub">${esc(t('piece'))}</div>
            </div>
            <div class="unit-row-price">
              ${hasDiscount ? `
                <div class="price-new">${finalDana.toLocaleString()} <small>${esc(cur)}</small></div>
                <div class="price-old">${danaP.toLocaleString()}</div>
              ` : `${danaP.toLocaleString()} <small>${esc(cur)}</small>`}
            </div>

              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>

            <div class="unit-row-label">
              <div class="unit-row-title"><span class="ico">📦</span>${esc(t('carton'))}</div>

              ${hasDiscount ? `
                <div class="price-new">${finalCarton.toLocaleString()} <small>${esc(cur)}</small></div>
                <div class="price-old">${cartonP.toLocaleString()}</div>
              ` : `${cartonP.toLocaleString()} <small>${esc(cur)}</small>`}
            </div>

function addToCart(id, unitType){
  const p=state.products.find(x=>x.id===id);if(!p)return;
  unitType = unitType || 'dana';
  const item=state.cart.find(x=>x.id===id && x.unitType===unitType);
  if(item)item.qty++;
  else state.cart.push({id,qty:1,unitType});
  renderCart();
  const cc=$('#cartCount');cc.classList.remove('bump');void cc.offsetWidth;cc.classList.add('bump');
  toast(t('added_cart')+' — '+getUnitLabel(unitType));
}
function removeFromCart(id, unitType){state.cart=state.cart.filter(x=>!(x.id===id && x.unitType===unitType));renderCart();}
function changeQty(id, unitType, delta){
  const item=state.cart.find(x=>x.id===id && x.unitType===unitType);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0)removeFromCart(id,unitType);
  else renderCart();
}
function cartTotal(){
  return state.cart.reduce((s,i)=>{
    const p=state.products.find(x=>x.id===i.id);
    return s+(p?(getPriceFor(p,i.unitType)*i.qty):0);
  },0);
}

function renderCart(){
  const body=$('#cartBody');
  const count=state.cart.reduce((s,i)=>s+i.qty,0);
  $('#cartCount').textContent=count;
  if(!state.cart.length){
    body.innerHTML=`<div class="cart-empty"><div class="e">🛒</div><p>${esc(t('cart_empty'))}</p></div>`;
    $('#cartFoot').style.display='none';return;
  }
  $('#cartFoot').style.display='block';
  const cur = state.settings.currency||'';
  body.innerHTML=state.cart.map(i=>{
    const p=state.products.find(x=>x.id===i.id);if(!p)return '';
    const name=p.name?.[state.lang]||p.name?.en||'—';
    const img=p.image?`<img src="${esc(p.image)}">`:(p.category==='biscuit'?'🍪':p.category==='nestle'?'🍫':'📦');
    const price = getPriceFor(p, i.unitType);
    const isCarton = i.unitType === 'carton';
    const pieces = getPieces(p);

  $$('[data-rm]').forEach(b=>b.onclick=()=>removeFromCart(b.dataset.rm, b.dataset.unit));
}

function sendOrder(){
  const name=$('#ckName').value.trim();
  const phone=$('#ckPhone').value.trim();
  const address=$('#ckAddress').value.trim();
  const notes=$('#ckNotes').value.trim();
  if(!name||!phone){toast(t('fill_required'));return;}
  
  const rep = getCurrentRep();
  let wa;
  if(rep && rep.whatsapp) wa = String(rep.whatsapp).replace(/\D/g,'');
  else wa = String(state.settings.whatsapp||'').replace(/\D/g,'');
  if(!wa||wa.length<8){toast(t('no_wa'));return;}
  const cur = state.settings.currency||'';
  
  const orderItems = state.cart.map(i=>{
    const p=state.products.find(x=>x.id===i.id);if(!p)return null;
    return {
      productId: p.id,
      name: p.name?.[state.lang] || p.name?.en || '',
      unitType: i.unitType,
      qty: i.qty,
      price: getPriceFor(p, i.unitType),
      pieces: getPieces(p),
      total: getPriceFor(p, i.unitType) * i.qty
    };
  }).filter(Boolean);
  
  const total = cartTotal();
  const orderNum = 'ORD-' + Date.now().toString().slice(-6);
  
  const order = {
    id: uid('ord'),
    orderNumber: orderNum,
    customer: { name, phone, address, notes },
    rep: rep ? { id: rep.id, name: rep.name, whatsapp: rep.whatsapp } : null,
    items: orderItems,
    total: total,
    currency: cur,
    status: 'pending',
    createdAt: new Date().toISOString()
  };
  
  if(typeof db !== 'undefined'){
    try { db.collection('orders').doc(order.id).set(order); } catch(e) { console.log(e); }
  }
  
  // Analytics event
  try {
    if(typeof analytics !== 'undefined' && analytics){
      analytics.logEvent('purchase', {
        transaction_id: orderNum,
        value: total,
        currency: cur,
        items: orderItems.length
      });
    }
  } catch(e) {}
  
  const lines=orderItems.map(i=>{
    const unitLabel = i.unitType === 'carton' 
      ? `📦 ${t('carton')}${i.pieces?' ('+i.pieces+' '+t('pieces')+')':''}`
      : `🍪 ${t('dana')}`;
    return `• ${i.name}\n   ${unitLabel} × ${i.qty} = ${i.total.toLocaleString()} ${cur}`;
  }).join('\n\n');
  
  const msgParts = [
    t('order_greeting'), '',
    lines, '',
    `${t('order_total')}: ${total.toLocaleString()} ${cur}`, '',
    `${t('order_name')}: ${name}`,
    `${t('order_phone')}: ${phone}`,
    `${t('order_address')}: ${address}`,
    `${t('order_notes')}: ${notes}`
  ];
  if(rep) msgParts.push('', `— ${rep.name}`);
  const msg = msgParts.join('\n');
  
  const url = `https://api.whatsapp.com/send?phone=${wa}&text=${encodeURIComponent(msg)}`;
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  
  closeModal('checkoutModal');
  state.cart = [];
  renderCart(); renderProducts();
  $('#ckName').value='';$('#ckPhone').value='';$('#ckAddress').value='';$('#ckNotes').value='';
  toast(t('order_sent_success'));
}

async function saveRep(){
  const name=$('#repName').value.trim();
  const phone=$('#repPhone').value.trim();
  const whatsapp=$('#repWhatsapp').value.replace(/\D/g,'') || phone.replace(/\D/g,'');
  let code=$('#repCode').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');

  if(!name){toast('⚠ '+t('fill_required'));return;}
  if(!whatsapp||whatsapp.length<8){toast('⚠ WhatsApp');return;}
  if(!code){code=slug(name)||uid('r');}
  const dup=state.reps.find(x=>x.code===code && x.id!==editingRepId);
  if(dup){code=code+Math.floor(Math.random()*99);}
  const rep={id:editingRepId||uid('rep'),name,phone,whatsapp,code,notes,active:true};
  if(editingRepId){
    const idx=state.reps.findIndex(x=>x.id===editingRepId);
    if(idx>=0)state.reps[idx]=rep;
  }else{state.reps.push(rep);}
  if(typeof db !== 'undefined'){
    try { await db.collection('config').doc('reps').set({list: state.reps}); } catch(e){console.error(e);}
  }
  renderRepList();renderRepBar();
  closeModal('repModal');
  toast(t('saved'));
}

async function saveProduct(){
  try {
    const danaVal = parseFloat($('#pPriceDana').value);
    const piecesVal = parseInt($('#pPieces').value) || 12;
    const cartonInput = parseFloat($('#pPriceCarton').value);
    const discountVal = parseFloat($('#pDiscount').value) || 0;
    const stockInput = $('#pStock').value;
    const stockVal = stockInput === '' ? null : Math.max(0, parseInt(stockInput) || 0);
    
    if (!danaVal || danaVal <= 0) {
      toast('⚠ ' + t('need_dana_price'));
      return;
    }
    
    const name = {}, desc = {};
    ['ku','ar','en'].forEach(l => {
      const nameEl = document.getElementById('pName_' + l);
      const descEl = document.getElementById('pDesc_' + l);
      name[l] = nameEl ? nameEl.value.trim() : '';
      desc[l] = descEl ? descEl.value.trim() : '';
    });
    
    if (!name.ku && !name.en && !name.ar) {
      toast('⚠ ' + t('need_name'));
      return;
    }
    
    const priceCarton = (isNaN(cartonInput) || cartonInput <= 0) 
      ? danaVal * piecesVal 
      : cartonInput;
    
    const existing = editingId ? state.products.find(x=>x.id===editingId) : null;
    
    const prod = {
      id: editingId || uid('p'),
      priceDana: danaVal,
      piecesPerCarton: piecesVal,
      priceCarton: priceCarton,
      category: $('#pCategory').value || 'biscuit',
      image: tempImage || $('#pImageUrl').value.trim() || '',
      name: name,
      desc: desc,
      discount: discountVal,
      stock: stockVal,
      createdAt: (existing && existing.createdAt) || new Date().toISOString()
    };
    
    if(typeof db !== 'undefined'){
      await db.collection('products').doc(prod.id).set(prod);
    }
    
    const idx = state.products.findIndex(x => x.id === prod.id);
    if (idx >= 0) state.products[idx] = prod;
    else state.products.push(prod);
    
    renderAdminList();
    renderProducts();
    closeModal('productModal');
    toast(t('saved'));
    
  } catch (err) {
    console.error('saveProduct error:', err);
    alert('❌ هەڵە: ' + err.message);
  }
}

async function bulkIncrease(){
  const pct = parseFloat($('#bulkAmount').value) || 0;
  if(pct <= 0) return toast('⚠');
  if(!confirm(t('bulk_confirm_inc').replace('{x}', pct))) return;
  for(const p of state.products){
    p.priceDana = Math.round(getDanaPrice(p) * (1 + pct/100));
    p.priceCarton = Math.round(getCartonPrice(p) * (1 + pct/100));
    if(typeof db !== 'undefined'){ await db.collection('products').doc(p.id).set(p); }
  }
  renderAdminList();renderProducts();toast(t('bulk_done'));
}

async function bulkDecrease(){
  const pct = parseFloat($('#bulkAmount').value) || 0;
  if(pct <= 0) return toast('⚠');
  if(!confirm(t('bulk_confirm_dec').replace('{x}', pct))) return;
  for(const p of state.products){
    p.priceDana = Math.max(0, Math.round(getDanaPrice(p) * (1 - pct/100)));
    p.priceCarton = Math.max(0, Math.round(getCartonPrice(p) * (1 - pct/100)));
    if(typeof db !== 'undefined'){ await db.collection('products').doc(p.id).set(p); }
  }
  renderAdminList();renderProducts();toast(t('bulk_done'));
}

async function bulkSetDana(){
  const val = parseFloat($('#bulkAmount').value) || 0;
  if(val <= 0) return toast('⚠');
  if(!confirm(t('bulk_confirm_set').replace('{x}', val))) return;
  for(const p of state.products){
    p.priceDana = val;
    p.priceCarton = val * getPieces(p);
    if(typeof db !== 'undefined'){ await db.collection('products').doc(p.id).set(p); }
  }
  renderAdminList();renderProducts();toast(t('bulk_done'));
}

async function init(){
  try{
    const savedTexts=JSON.parse(localStorage.getItem('saf_texts')||'{}');
    state.texts={
      ku:{...DEFAULT_TEXTS.ku,...(savedTexts.ku||{})},
      ar:{...DEFAULT_TEXTS.ar,...(savedTexts.ar||{})},
      en:{...DEFAULT_TEXTS.en,...(savedTexts.en||{})}
    };
  }catch(e){state.texts=JSON.parse(JSON.stringify(DEFAULT_TEXTS));}
  try{state.settings={...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem('saf_settings')||'{}')};}
  catch(e){state.settings={...DEFAULT_SETTINGS};}
  try{state.reps=JSON.parse(localStorage.getItem('saf_reps')||'[]');}catch(e){state.reps=[];}
  
  if(typeof db !== 'undefined'){
    db.collection('products').onSnapshot(snapshot => {
      const prods = [];
      snapshot.forEach(doc => prods.push(doc.data()));
      if(prods.length > 0){
        state.products = prods;
      } else {
        DEFAULT_PRODUCTS.forEach(p => db.collection('products').doc(p.id).set(p));
        state.products = DEFAULT_PRODUCTS;
      }
      renderProducts();
      if($('#adminModal').classList.contains('open')) renderAdminList();
    }, err => {
      console.log("Firestore error:", err);
      state.products = DEFAULT_PRODUCTS;
      renderProducts();
    });
    
    db.collection('config').doc('settings').onSnapshot(doc => {
      if(doc.exists){
        state.settings = {...DEFAULT_SETTINGS, ...doc.data()};
        applyLang();
      }
    });
    
    db.collection('config').doc('reps').onSnapshot(doc => {
      if(doc.exists && doc.data().list){
        state.reps = doc.data().list;
        renderRepBar();
        if($('#adminModal').classList.contains('open')) renderRepList();
      }
    });
    
    db.collection('config').doc('texts').onSnapshot(doc => {
      if(doc.exists && doc.data().content){
        state.texts = doc.data().content;
        applyLang();
      }
    });
    
    db.collection('config').doc('branding').onSnapshot(doc => {
      if(doc.exists && doc.data().logo){
        customLogo = doc.data().logo;
        injectLogo();
      }
    });
  } else {
    state.products = DEFAULT_PRODUCTS;
  }
  
  checkUrlRep();
  injectLogo();
  applyLang();
  
  $$('.lang-btn').forEach(b=>{
    b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('saf_lang',state.lang);applyLang();
      if($('#adminModal').classList.contains('open')){renderAdminList();renderRepList();}};
  });
  
  $('#cartBtn').onclick=openCart;
  $('#closeCart').onclick=closeCart;
  $('#overlay').onclick=closeCart;
  $('#searchBox').oninput=e=>{state.search=e.target.value;renderProducts();};
  
  $('#checkoutBtn').onclick=()=>{
    if(!state.cart.length)return;
    const activeReps = state.reps.filter(r=>r.active!==false);
    if(activeReps.length>0 && !getCurrentRep()){
      toast('⚠ '+t('select_rep'));
      $('#repBar').scrollIntoView({behavior:'smooth',block:'start'});
      return;
    }
    closeCart();openModal('checkoutModal');
  };
  $('#sendOrderBtn').onclick=sendOrder;
  
  $('#menuBtn').onclick=()=>$('#mainNav').classList.toggle('mobile-open');
  $$('#mainNav a').forEach(a=>a.onclick=()=>$('#mainNav').classList.remove('mobile-open'));
  
  $('#repSelect').onchange=e=>{
    const v=e.target.value;
    if(v){
      state.currentRepId=v;
      localStorage.setItem('saf_current_rep',v);
      renderRepBar();
      const rep = getCurrentRep();
      if(rep) toast('✅ '+rep.name);
    }else{
      state.currentRepId='';
      localStorage.removeItem('saf_current_rep');
      renderRepBar();
    }
  };
  
  window.addEventListener('scroll',()=>{$('#header').classList.toggle('scrolled',window.scrollY>10);},{passive:true});
  
  $('#adminLink').onclick=openAdmin;
  $('#loginBtn').onclick=()=>{
    if($('#adminPass').value===state.settings.password){
      adminAuthed=true;
      $('#loginScreen').style.display='none';
      $('#adminPanel').style.display='flex';
      renderAdminList();
    }else{$('#loginErr').textContent=t('wrong_pass');}
  };
  $('#adminPass').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click();};
  
  $$('.admin-tab').forEach(tab=>{
    tab.onclick=()=>{
      $$('.admin-tab').forEach(x=>x.classList.remove('active'));
      tab.classList.add('active');
      $$('.admin-pane').forEach(p=>p.classList.remove('active'));
      $('#pane-'+tab.dataset.pane).classList.add('active');
      if(tab.dataset.pane==='texts')renderTextsForm();
      if(tab.dataset.pane==='settings')renderSettings();
      if(tab.dataset.pane==='reps')renderRepList();
    };
  });
  
  document.getElementById('addProductBtn').addEventListener('click', function(e){ e.preventDefault(); openProductForm(null); });
  document.getElementById('saveProductBtn').addEventListener('click', function(e){ e.preventDefault(); saveProduct(); });
  
  $('#bulkIncBtn').onclick=bulkIncrease;
  $('#bulkDecBtn').onclick=bulkDecrease;
  $('#bulkSetBtn').onclick=bulkSetDana;
  
  document.getElementById('addRepBtn').addEventListener('click', function(e){ e.preventDefault(); openRepForm(null); });
  document.getElementById('saveRepBtn').addEventListener('click', function(e){ e.preventDefault(); saveRep(); });
  
  $('#pImageFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    toast('...');
    tempImage=await compressImage(f);
    $('#imgPreview').innerHTML=`<img src="${tempImage}">`;
    $('#pImageUrl').value='';
  };
  $('#pImageUrl').oninput=e=>{
    if(e.target.value.trim()){tempImage='';$('#imgPreview').innerHTML=`<img src="${esc(e.target.value)}">`;}
  };
  
  $('#pPriceDana').oninput = autoFillCarton;
  $('#pPieces').oninput = autoFillCarton;
  function autoFillCarton(){
    const d = parseFloat($('#pPriceDana').value) || 0;
    const pc = parseInt($('#pPieces').value) || 0;
    if(d && pc && !$('#pPriceCarton').value){
      $('#pPriceCarton').placeholder = (d * pc).toLocaleString();
    }
  }
  
  $$('#productModal .lang-tab').forEach(tb=>{
    tb.onclick=()=>{
      $$('#productModal .lang-tab').forEach(x=>x.classList.remove('active'));
      tb.classList.add('active');
      $$('#productModal .lang-pane').forEach(p=>p.classList.toggle('active',p.dataset.plang===tb.dataset.plang));
    };
  });
  
  $$('[data-tlang]').forEach(b=>{
    b.onclick=()=>{
      currentTextLang=b.dataset.tlang;
      $$('[data-tlang]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');renderTextsForm();
    };
  });
  $('#saveTextsBtn').onclick=async()=>{
    const obj={};
    $$('#textsForm [data-tkey]').forEach(el=>{obj[el.dataset.tkey]=el.value;});
    state.texts[currentTextLang]={...state.texts[currentTextLang],...obj};
    localStorage.setItem('saf_texts',JSON.stringify(state.texts));
    if(typeof db !== 'undefined'){
      try { await db.collection('config').doc('texts').set({content: state.texts}); } catch(e){console.error(e);}
    }
    applyLang();toast(t('saved'));
  };
  
  $('#sLogoFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    toast('⏳ ...');
    customLogo=await compressImage(f,500,0.92);
    localStorage.setItem('saf_logo',customLogo);
    if(typeof db !== 'undefined'){
      try { await db.collection('config').doc('branding').set({logo: customLogo}); } catch(e){console.error(e);}
    }
    injectLogo();renderSettings();toast(t('saved'));
  };
  $('#resetLogoBtn').onclick=async()=>{
    if(!confirm('🔄 '+t('reset_logo')+'?'))return;
    customLogo='';localStorage.removeItem('saf_logo');
    if(typeof db !== 'undefined'){
      try { await db.collection('config').doc('branding').set({logo: ''}); } catch(e){console.error(e);}
    }
    injectLogo();renderSettings();toast('✅');
  };
  
  $('#saveSettingsBtn').onclick=async()=>{
    state.settings.phone=$('#sPhone').value.trim();
    state.settings.whatsapp=$('#sWhatsapp').value.replace(/\D/g,'');
    state.settings.address=$('#sAddress').value.trim();
    state.settings.hours=$('#sHours').value.trim();
    state.settings.currency=$('#sCurrency').value.trim()||'IQD';
    const np=$('#sNewPass').value.trim();
    if(np)state.settings.password=np;
    localStorage.setItem('saf_settings',JSON.stringify(state.settings));
    if(typeof db !== 'undefined'){
      try { await db.collection('config').doc('settings').set(state.settings); } catch(e){console.error(e);}
    }
    applyLang();toast(t('saved'));
  };
  
  $('#exportBtn').onclick=()=>{
    const data={products:state.products,texts:state.texts,settings:state.settings,reps:state.reps,logo:customLogo,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='saf-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  };
  
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      if(data.products&&Array.isArray(data.products)){
        if(typeof db !== 'undefined'){
          for(const p of data.products){ await db.collection('products').doc(p.id).set(p); }
        }
        state.products=data.products;
      }
      if(data.texts){state.texts=data.texts;localStorage.setItem('saf_texts',JSON.stringify(state.texts));
        if(typeof db !== 'undefined'){ await db.collection('config').doc('texts').set({content: state.texts}); }
      }
      if(data.settings){state.settings={...DEFAULT_SETTINGS,...data.settings};localStorage.setItem('saf_settings',JSON.stringify(state.settings));
        if(typeof db !== 'undefined'){ await db.collection('config').doc('settings').set(state.settings); }
      }
      if(data.reps){state.reps=data.reps;localStorage.setItem('saf_reps',JSON.stringify(state.reps));
        if(typeof db !== 'undefined'){ await db.collection('config').doc('reps').set({list: state.reps}); }
      }
      if(data.logo){customLogo=data.logo;localStorage.setItem('saf_logo',customLogo);
        if(typeof db !== 'undefined'){ await db.collection('config').doc('branding').set({logo: customLogo}); }
      }
      injectLogo();applyLang();renderAdminList();renderRepList();renderSettings();toast(t('saved'));
    }catch(err){alert('Invalid file');}
  };
  
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal('productModal');closeModal('checkoutModal');closeModal('repModal');closeCart();}
  });
  
  console.log('✅ Shorouk Al Fajr ready | Admin: aso123');
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
